<section class="card">
  <h2>Productos por bodega</h2>

  <table>
    <thead>
      <tr>
        <th>Producto</th>
        <th>Precio</th>
        <th>Cantidad</th>
        <th>Bodega</th>
      </tr>
    </thead>
    <tbody>
      @for (bodega of bodegas(); track bodega.id) {
        @for (producto of bodega.productos ?? []; track producto.id) {
          <tr>
            <td>{{ producto.nombre }}</td>
            <td>{{ producto.precio }}</td>
            <td>{{ producto.cantidad }}</td>
            <td>{{ bodega.nombre }}</td>
          </tr>
        }
      }
    </tbody>
  </table>
</section>
