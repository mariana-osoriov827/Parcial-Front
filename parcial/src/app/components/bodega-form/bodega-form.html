<section class="card">
  <h2>Registrar bodega</h2>
  <form (ngSubmit)="guardar()" class="form">
    <label>
      Nombre
      <input type="text" name="nombre" [(ngModel)]="bodega.nombre" required />
    </label>

    <label>
      Ubicación
      <input type="text" name="ubicacion" [(ngModel)]="bodega.ubicacion" required />
    </label>

    <button type="submit">Guardar</button>
  </form>

  @if (mensaje()) {
    <p class="mensaje" [class.error]="esError()">{{ mensaje() }}</p>
  }
</section>
